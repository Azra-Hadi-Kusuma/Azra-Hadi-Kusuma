<svg width="860" height="220" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .category-title { font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; }
      .pill-text { font-size: 12px; font-weight: 500; fill: #e2e8f0; }
      .card { transition: all 0.3s ease; }
      @keyframes floatGlow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      .glow-border { animation: floatGlow 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Section 1: Frontend & UI -->
  <g transform="translate(1, 10)">
    <rect width="274" height="200" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" class="glow-border"/>
    <path d="M 1 10 C 1 5 5 1 10 1 L 264 1 C 269 1 273 5 273 10 L 273 34 L 1 34 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="34" y="22" class="mono category-title">01 // FRONTEND</text>

    <!-- Chips -->
    <g transform="translate(18, 52)">
      <!-- Next.js -->
      <rect width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" class="mono pill-text">&bull; Next.js 15</text>

      <!-- React -->
      <rect x="120" width="118" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="134" y="18" class="mono pill-text">&bull; React 19</text>

      <!-- TypeScript -->
      <rect y="38" width="118" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="56" class="mono pill-text">&bull; TypeScript</text>

      <!-- Tailwind -->
      <rect x="128" y="38" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="142" y="56" class="mono pill-text">&bull; Tailwind</text>

      <!-- TUI / UI Tokens -->
      <rect y="76" width="238" height="28" rx="6" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="94" class="mono" font-size="11.5" fill="#38bdf8">&gt; Responsive &amp; Anti-Glass UI</text>

      <rect y="114" width="238" height="24" rx="4" fill="#0f172a" fill-opacity="0.5"/>
      <text x="14" y="130" class="mono" font-size="10.5" fill="#64748b">Figma Tokens &bull; Radix &bull; Lucide</text>
    </g>
  </g>

  <!-- Section 2: Backend & Systems -->
  <g transform="translate(293, 10)">
    <rect width="274" height="200" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" class="glow-border"/>
    <path d="M 1 10 C 1 5 5 1 10 1 L 264 1 C 269 1 273 5 273 10 L 273 34 L 1 34 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="20" cy="18" r="4" fill="#818cf8" />
    <text x="34" y="22" class="mono category-title" fill="#818cf8">02 // BACKEND</text>

    <!-- Chips -->
    <g transform="translate(18, 52)">
      <!-- Laravel -->
      <rect width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" class="mono pill-text">&bull; Laravel</text>

      <!-- Python -->
      <rect x="120" width="118" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="134" y="18" class="mono pill-text">&bull; Python</text>

      <!-- Node / Bun -->
      <rect y="38" width="118" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="56" class="mono pill-text">&bull; Node / Bun</text>

      <!-- PostgreSQL -->
      <rect x="128" y="38" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="142" y="56" class="mono pill-text">&bull; Postgres</text>

      <!-- Supabase & SQLite -->
      <rect y="76" width="238" height="28" rx="6" fill="#4338ca" fill-opacity="0.15" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="94" class="mono" font-size="11.5" fill="#a5b4fc">&gt; Supabase &bull; SQLite &bull; REST</text>

      <rect y="114" width="238" height="24" rx="4" fill="#0f172a" fill-opacity="0.5"/>
      <text x="14" y="130" class="mono" font-size="10.5" fill="#64748b">Prisma &bull; Redis &bull; Auth Workflows</text>
    </g>
  </g>

  <!-- Section 3: Engineering & Dev Environment -->
  <g transform="translate(585, 10)">
    <rect width="274" height="200" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" class="glow-border"/>
    <path d="M 1 10 C 1 5 5 1 10 1 L 264 1 C 269 1 273 5 273 10 L 273 34 L 1 34 Z" fill="#0f172a" fill-opacity="0.8"/>
    <circle cx="20" cy="18" r="4" fill="#34d399" />
    <text x="34" y="22" class="mono category-title" fill="#34d399">03 // TOOLING</text>

    <!-- Chips -->
    <g transform="translate(18, 52)">
      <!-- MCP Servers -->
      <rect width="114" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" class="mono pill-text">&bull; MCP Server</text>

      <!-- Git / CI -->
      <rect x="124" width="114" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="138" y="18" class="mono pill-text">&bull; Git &amp; CI/CD</text>

      <!-- Docker -->
      <rect y="38" width="114" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="56" class="mono pill-text">&bull; Docker</text>

      <!-- Terminal -->
      <rect x="124" y="38" width="114" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="138" y="56" class="mono pill-text">&bull; Oh My Posh</text>

      <!-- Agents & Scripting -->
      <rect y="76" width="238" height="28" rx="6" fill="#065f46" fill-opacity="0.15" stroke="#059669" stroke-width="1"/>
      <text x="14" y="94" class="mono" font-size="11.5" fill="#6ee7b7">&gt; AI Agent Scripting &amp; Auto-Dev</text>

      <rect y="114" width="238" height="24" rx="4" fill="#0f172a" fill-opacity="0.5"/>
      <text x="14" y="130" class="mono" font-size="10.5" fill="#64748b">Bash &bull; PowerShell 7 &bull; Linux</text>
    </g>
  </g>
</svg>
