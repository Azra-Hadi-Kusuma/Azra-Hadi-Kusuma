<svg width="860" height="90" viewBox="0 0 860 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1.1s infinite; }
      @keyframes floatPath {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .dash-line {
        stroke-dasharray: 8, 12;
        animation: floatPath 8s linear infinite;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="858" height="88" rx="10" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="20" y1="44" x2="840" y2="44" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1" class="dash-line"/>

  <!-- Command Line Prompt -->
  <text x="28" y="28" class="mono" font-size="12" fill="#38bdf8">❯</text>
  <text x="44" y="28" class="mono" font-size="12" fill="#64748b">azra.execute(</text>
  <text x="148" y="28" class="mono" font-size="12" fill="#34d399">"ship_quality_code"</text>
  <text x="296" y="28" class="mono" font-size="12" fill="#64748b">)</text>
  <rect x="312" y="16" width="7" height="14" fill="#38bdf8" class="cursor"/>

  <!-- Meta info right -->
  <text x="832" y="28" text-anchor="end" class="mono" font-size="11" fill="#475569">system_latency: 18ms &bull; no_templates</text>

  <!-- Bottom Details -->
  <text x="28" y="68" class="mono" font-size="11.5" fill="#94a3b8">Ready for collaborations, system engineering, and high-impact products.</text>
  <text x="832" y="68" text-anchor="end" class="mono" font-size="11" fill="#38bdf8">&copy; 2026 Azra Hadi Kusuma (zabuzz)</text>
</svg>
